<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>elkiss</title>
  <meta name="description" content="">
  <style>
    :root {
      --bg: #faf9f7;
      --card: #ffffff;
      --text: #1c1c1a;
      --text-sub: #6b6a66;
      --line: #e5e3de;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 48px 20px 40px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 400px;
      margin: 0 auto;
    }

    /* 프로필 */
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      margin: 0 auto 16px;
      background: var(--line);
      display: block;
      object-fit: cover;
    }

    .name {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 600;
      text-align: center;
    }

    .bio {
      margin: 0 0 32px;
      font-size: 14px;
      color: var(--text-sub);
      text-align: center;
    }

    /* 링크 카드 */
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      text-decoration: none;
      color: inherit;
      transition: transform .12s ease, border-color .12s ease;
    }

    .card:active {
      transform: scale(.98);
    }

    .card__icon {
      flex: none;
      width: 24px;
      height: 24px;
      color: var(--text-sub);
    }

    .card__title {
      display: block;
      font-size: 15px;
      font-weight: 500;
    }

    .card__desc {
      display: block;
      font-size: 12px;
      color: var(--text-sub);
    }

    .card__arrow {
      flex: none;
      margin-left: auto;
      width: 16px;
      height: 16px;
      color: var(--text-sub);
    }

    footer {
      margin-top: 40px;
      font-size: 12px;
      color: var(--text-sub);
      text-align: center;
    }

    /* 마우스가 있는 기기에서만 hover */
    @media (hover: hover) {
      .card:hover { border-color: #c9c6bf; }
    }
  </style>
</head>
<body>
  <main class="wrap">

    <img class="avatar" src="https://github.com/elkiss87.png?size=200"
         width="88" height="88" alt="" loading="eager">
    <h1 class="name">Under construction</h1>
    <p class="bio">Building this. Check back soon.</p>

    <nav class="links">

      <a class="card" href="#">
        <svg class="card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.6" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1"/>
        </svg>
        <span>
          <span class="card__title">링크 이름</span>
          <span class="card__desc">짧은 설명</span>
        </span>
        <svg class="card__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" aria-hidden="true">
          <path d="M7 17 17 7M9 7h8v8"/>
        </svg>
      </a>

      <a class="card" href="#">
        <svg class="card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.6" aria-hidden="true">
          <path d="M4 5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>
          <path d="M14 3v6h6M8 13h8M8 17h5"/>
        </svg>
        <span>
          <span class="card__title">링크 이름</span>
          <span class="card__desc">짧은 설명</span>
        </span>
        <svg class="card__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" aria-hidden="true">
          <path d="M7 17 17 7M9 7h8v8"/>
        </svg>
      </a>

      <a class="card" href="#">
        <svg class="card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.6" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M3.5 9h17M3.5 15h17M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/>
        </svg>
        <span>
          <span class="card__title">링크 이름</span>
          <span class="card__desc">짧은 설명</span>
        </span>
        <svg class="card__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" aria-hidden="true">
          <path d="M7 17 17 7M9 7h8v8"/>
        </svg>
      </a>

    </nav>

    <footer>&copy; 2026</footer>

  </main>
</body>
</html>
