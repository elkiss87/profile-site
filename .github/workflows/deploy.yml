name: Custom Deploy to GitHub Pages

on:
  # main 브랜치에 푸시될 때마다 실행
  push:
    branches: ["main"]
  # Actions 탭에서 수동으로 버튼을 눌러 실행할 수 있게 허용
  workflow_dispatch:

# GITHUB_TOKEN의 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시성(Concurrency) 설정: 아까 같은 무한 대기열 꼬임을 방지하는 핵심!
# 진행 중인 배포가 있으면 강제로 취소하고 최신 커밋으로만 덮어씌웁니다.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 사이트에 필요한 파일만 골라 담는다.
      # 저장소 루트를 통째로 올리면 README.md, CLAUDE.md, docs/ 까지
      # elkiss.me 에서 그대로 열린다. public 저장소라 유출은 아니지만,
      # 개인 도메인에서 작업 문서 원본이 서비스될 이유는 없다.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp CNAME _site/
          echo "--- 배포될 파일 ---"
          find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4